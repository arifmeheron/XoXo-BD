<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XoXo BD - UID TopUp</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f2f6ff;
    color:#17385f;
    padding-bottom:30px;
}

/* HEADER */

.header{
    height:72px;
    background:#ffffff;
    display:flex;
    align-items:center;
    padding:0 15px;
    gap:14px;
    box-shadow:0 2px 8px rgba(0,0,0,0.10);
}

.back{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#eee7ff;
    color:#6735c5;
    font-size:25px;
    font-weight:bold;
}

.logo{
    font-size:24px;
    font-weight:900;
    color:#6735c5;
}


/* MAIN */

.container{
    padding:18px 15px;
}

.title{
    text-align:center;
    font-size:27px;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#777;
    font-size:14px;
    margin-bottom:20px;
}


/* PLAYER UID */

.uid-box{
    background:#ffffff;
    border-radius:10px;
    padding:15px;
    margin-bottom:22px;
    box-shadow:0 3px 10px rgba(0,0,0,0.07);
}

.uid-box label{
    display:block;
    font-size:15px;
    font-weight:bold;
    margin-bottom:7px;
}

.uid-input{
    width:100%;
    height:47px;
    border:1px solid #d8d8d8;
    border-radius:8px;
    padding:0 12px;
    font-size:15px;
    outline:none;
}

.uid-input:focus{
    border-color:#6735c5;
}


/* SELECT RECHARGE */

.select-title{
    font-size:21px;
    margin-bottom:12px;
}


/* GRID */

.package-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}


/* SMALL CARD */

.package{
    width:100%;
    height:98px;

    background:#ffffff;

    border:1px solid #dedede;
    border-radius:9px;

    padding:9px 6px;

    text-align:center;

    cursor:pointer;

    box-shadow:0 2px 6px rgba(0,0,0,0.06);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.package.selected{
    border:2px solid #6735c5;
    background:#f5f0ff;
}


/* DIAMOND TEXT */

.diamond{
    font-size:13px;
    color:#777;
    margin-bottom:3px;
}


/* AMOUNT */

.amount{
    display:block;
    color:#6735c5;
    font-size:15px;
    font-weight:800;
}


/* PRICE */

.price{
    display:block;
    color:#222;
    font-size:13px;
    font-weight:bold;
    margin-top:4px;
}


/* CONTINUE */

.continue{
    width:100%;
    height:50px;

    margin-top:20px;

    border:0;
    border-radius:9px;

    background:#6735c5;
    color:#ffffff;

    font-size:17px;
    font-weight:bold;
}


/* SMALL PHONE */

@media(max-width:390px){

    .container{
        padding-left:13px;
        padding-right:13px;
    }

    .package{
        height:94px;
    }

    .amount{
        font-size:14px;
    }

    .price{
        font-size:12px;
    }

}


/* VERY SMALL PHONE */

@media(max-width:360px){

    .package{
        height:90px;
    }

    .amount{
        font-size:13px;
    }

    .diamond{
        font-size:12px;
    }

    .price{
        font-size:12px;
    }

}

</style>
</head>


<body>


<!-- HEADER -->

<div class="header">

    <button class="back" onclick="goHome()">
        &lt;
    </button>

    <div class="logo">
        XoXo BD
    </div>

</div>



<!-- MAIN -->

<div class="container">

    <h1 class="title">
        UID TOPUP (BD)
    </h1>

    <p class="subtitle">
        Select your recharge
    </p>



    <!-- PLAYER UID -->

    <div class="uid-box">

        <label>
            Player UID
        </label>

        <input
            id="uid"
            class="uid-input"
            type="number"
            placeholder="Enter Player UID"
        >

    </div>



    <!-- SELECT RECHARGE -->

    <h2 class="select-title">
        Select Recharge
    </h2>



    <!-- DIAMOND CARDS -->

    <div class="package-grid">


        <div class="package"
        onclick="selectPackage(this,'25 Diamonds','20')">

            <div class="diamond">
                Diamond
            </div>

            <span class="amount">
                25 Diamonds
            </span>

            <span class="price">
                Tk 20
            </span>

        </div>



        <div class="package"
        onclick="selectPackage(this,'50 Diamonds','35')">

            <div class="diamond">
                Diamond
            </div>

            <span class="amount">
                50 Diamonds
            </span>

            <span class="price">
                Tk 35
            </span>

        </div>



        <div class="package"
        onclick="selectPackage(this,'115 Diamonds','75')">

            <div class="diamond">
                Diamond
            </div>

            <span class="amount">
                115 Diamonds
            </span>

            <span class="price">
                Tk 75
            </span>

        </div>



        <div class="package"
        onclick="selectPackage(this,'240 Diamonds','150')">

            <div class="diamond">
                Diamond
            </div>

            <span class="amount">
                240 Diamonds
            </span>

            <span class="price">
                Tk 150
            </span>

        </div>



        <div class="package"
        onclick="selectPackage(this,'355 Diamonds','220')">

            <div class="diamond">
                Diamond
            </div>

            <span class="amount">
                355 Diamonds
            </span>

            <span class="price">
                Tk 220
            </span>

        </div>



        <div class="package"
        onclick="selectPackage(this,'480 Diamonds','300')">

            <div class="diamond">
                Diamond
            </div>

            <span class="amount">
                480 Diamonds
            </span>

            <span class="price">
                Tk 300
            </span>

        </div>



        <div class="package"
        onclick="selectPackage(this,'610 Diamonds','380')">

            <div class="diamond">
                Diamond
            </div>

            <span class="amount">
                610 Diamonds
            </span>

            <span class="price">
                Tk 380
            </span>

        </div>



        <div class="package"
        onclick="selectPackage(this,'850 Diamonds','520')">

            <div class="diamond">
                Diamond
            </div>

            <span class="amount">
                850 Diamonds
            </span>

            <span class="price">
                Tk 520
            </span>

        </div>


    </div>



    <!-- CONTINUE -->

    <button class="continue" onclick="continueOrder()">
        Continue
    </button>

</div>



<script>

var selectedPackage = "";
var selectedPrice = "";


function selectPackage(card,name,price){

    var cards =
    document.querySelectorAll(".package");

    for(
        var i = 0;
        i < cards.length;
        i++
    ){

        cards[i].classList.remove("selected");

    }

    card.classList.add("selected");

    selectedPackage = name;
    selectedPrice = price;
}


function continueOrder(){

    var uid =
    document.getElementById("uid").value;

    if(uid === ""){

        alert("Please enter Player UID");

        return;
    }

    if(selectedPackage === ""){

        alert("Please select a package");

        return;
    }

    alert(
        "UID: " + uid +
        "\nPackage: " + selectedPackage +
        "\nPrice: Tk " + selectedPrice
    );

}


function goHome(){

    window.location.href =
    "index.html";

}

</script>

</body>
</html>
