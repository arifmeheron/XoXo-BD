<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XoXo BD - UID TopUp</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f2f6ff;
    color:#17385f;
    padding-bottom:30px;
}

/* HEADER */

.header{
    height:75px;
    background:white;
    display:flex;
    align-items:center;
    padding:0 15px;
    gap:15px;
    box-shadow:0 2px 8px rgba(0,0,0,0.10);
}

.back{
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    background:#eee7ff;
    color:#6735c5;
    font-size:28px;
    font-weight:bold;
}

.logo{
    font-size:25px;
    font-weight:bold;
    color:#6735c5;
}


/* MAIN */

.container{
    padding:20px 15px;
}

.title{
    text-align:center;
    font-size:29px;
    margin-bottom:6px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:22px;
}


/* UID BOX */

.uid-box{
    background:white;
    border-radius:12px;
    padding:18px;
    margin-bottom:25px;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.uid-box label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

.uid-input{
    width:100%;
    height:50px;
    border:2px solid #ddd;
    border-radius:9px;
    padding:0 13px;
    font-size:16px;
    outline:none;
}

.uid-input:focus{
    border-color:#6735c5;
}


/* TITLE */

.select-title{
    font-size:23px;
    margin-bottom:14px;
}


/* PACKAGE GRID */

.package-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}


/* PACKAGE CARD */

.package{
    background:white;
    border:2px solid #e1e1e1;
    border-radius:12px;
    min-height:135px;
    padding:15px 8px;
    text-align:center;
    cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,0.06);
}

.package.selected{
    border-color:#6735c5;
    background:#f4efff;
}


/* DIAMOND */

.diamond{
    font-size:38px;
    margin-bottom:7px;
}


/* TEXT */

.amount{
    display:block;
    color:#6735c5;
    font-size:18px;
    font-weight:bold;
}

.price{
    display:block;
    color:#222;
    font-size:16px;
    font-weight:bold;
    margin-top:7px;
}


/* BUTTON */

.continue{
    width:100%;
    height:52px;
    margin-top:24px;
    border:none;
    border-radius:10px;
    background:#6735c5;
    color:white;
    font-size:18px;
    font-weight:bold;
}


/* MOBILE */

@media(max-width:390px){

    .package{
        min-height:125px;
        padding:13px 5px;
    }

    .amount{
        font-size:16px;
    }

    .price{
        font-size:15px;
    }

}

</style>
</head>


<body>


<!-- HEADER -->

<div class="header">

    <button class="back" onclick="goHome()">
        &lt;
    </button>

    <div class="logo">
        XoXo BD
    </div>

</div>


<!-- MAIN -->

<div class="container">

    <h1 class="title">
        UID TOPUP (BD)
    </h1>

    <p class="subtitle">
        Select your recharge
    </p>


    <!-- UID -->

    <div class="uid-box">

        <label>
            Player UID
        </label>

        <input
            id="uid"
            class="uid-input"
            type="number"
            placeholder="Enter Player UID"
        >

    </div>


    <!-- PACKAGES -->

    <h2 class="select-title">
        Select Recharge
    </h2>


    <div class="package-grid">


        <div class="package"
             onclick="selectPackage(this,'25 Diamonds','20')">

            <div class="diamond">
                Diamond
            </div>

            <span class="amount">
                25 Diamonds
            </span>

            <span class="price">
                Tk 20
            </span>

        </div>


        <div class="package"
             onclick="selectPackage(this,'50 Diamonds','35')">

            <div class="diamond">
                Diamond
            </div>

            <span class="amount">
                50 Diamonds
            </span>

            <span class="price">
                Tk 35
            </span>

        </div>


        <div class="package"
             onclick="selectPackage(this,'115 Diamonds','75')">

            <div class="diamond">
                Diamond
            </div>

            <span class="amount">
                115 Diamonds
            </span>

            <span class="price">
                Tk 75
            </span>

        </div>


        <div class="package"
             onclick="selectPackage(this,'240 Diamonds','150')">

            <div class="diamond">
                Diamond
            </div>

            <span class="amount">
                240 Diamonds
            </span>

            <span class="price">
                Tk 150
            </span>

        </div>


        <div class="package"
             onclick="selectPackage(this,'355 Diamonds','220')">

            <div class="diamond">
                Diamond
            </div>

            <span class="amount">
                355 Diamonds
            </span>

            <span class="price">
                Tk 220
            </span>

        </div>


        <div class="package"
             onclick="selectPackage(this,'480 Diamonds','300')">

            <div class="diamond">
                Diamond
            </div>

            <span class="amount">
                480 Diamonds
            </span>

            <span class="price">
                Tk 300
            </span>

        </div>


        <div class="package"
             onclick="selectPackage(this,'610 Diamonds','380')">

            <div class="diamond">
                Diamond
            </div>

            <span class="amount">
                610 Diamonds
            </span>

            <span class="price">
                Tk 380
            </span>

        </div>


        <div class="package"
             onclick="selectPackage(this,'850 Diamonds','520')">

            <div class="diamond">
                Diamond
            </div>

            <span class="amount">
                850 Diamonds
            </span>

            <span class="price">
                Tk 520
            </span>

        </div>


    </div>


    <!-- CONTINUE -->

    <button class="continue" onclick="continueOrder()">
        Continue
    </button>

</div>


<script>

var selectedPackage = "";
var selectedPrice = "";


function selectPackage(card,name,price){

    var cards = document.querySelectorAll(".package");

    for(var i=0;i<cards.length;i++){
        cards[i].classList.remove("selected");
    }

    card.classList.add("selected");

    selectedPackage = name;
    selectedPrice = price;
}


function continueOrder(){

    var uid = document.getElementById("uid").value;

    if(uid === ""){
        alert("Please enter Player UID");
        return;
    }

    if(selectedPackage === ""){
        alert("Please select a package");
        return;
    }

    alert(
        "UID: " + uid +
        "\nPackage: " + selectedPackage +
        "\nPrice: Tk " + selectedPrice
    );
}


function goHome(){

    window.location.href = "index.html";

}

</script>


</body>
</html>
